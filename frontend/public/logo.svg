<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">炽热API</title>
  <desc id="desc">A flame symbol representing the blazing-fast ChiRe API gateway.</desc>
  <defs>
    <linearGradient id="chre-bg" x1="72" y1="44" x2="442" y2="478" gradientUnits="userSpaceOnUse">
      <stop stop-color="#431407"/>
      <stop offset=".52" stop-color="#2a0d0a"/>
      <stop offset="1" stop-color="#1c090c"/>
    </linearGradient>
    <radialGradient id="chre-ambient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(168 92) rotate(51) scale(342 382)">
      <stop stop-color="#f97316" stop-opacity=".32"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chre-flame" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fdba74"/>
      <stop offset=".5" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="chre-shadow" x="-25%" y="-25%" width="150%" height="165%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy=".55" stdDeviation=".65" flood-color="#1c090c" flood-opacity=".4"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#chre-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#chre-ambient)"/>
  <rect x="16.75" y="16.75" width="478.5" height="478.5" rx="119.25" fill="none" stroke="#fdba74" stroke-opacity=".18" stroke-width="1.5"/>

  <g transform="translate(52 52) scale(17)" fill="none" stroke="url(#chre-flame)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" filter="url(#chre-shadow)">
    <path d="M15.362 5.214A8.252 8.252 0 0 1 12 21 8.25 8.25 0 0 1 6.038 7.047 8.287 8.287 0 0 0 9 9.601a8.983 8.983 0 0 1 3.361-6.867 8.21 8.21 0 0 0 3 2.48Z"/>
    <path d="M12 18a3.75 3.75 0 0 0 .495-7.468 5.99 5.99 0 0 0-1.925 3.547 5.975 5.975 0 0 1-2.133-1.001A3.75 3.75 0 0 0 12 18Z"/>
